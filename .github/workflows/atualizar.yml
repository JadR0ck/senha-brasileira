name: Atualizar bancos de senha (diário)

# Roda todo dia às 09:00 UTC (06:00 em Brasília) e também sob demanda.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar notícias e regenerar bancos.json
        run: python3 atualizar_bancos.py

      - name: Commitar se houve mudança
        run: |
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- bancos.json; then
            echo "Sem novidades nas notícias de hoje."
          else
            git config user.name  "senha-brasileira-bot"
            git config user.email "bot@users.noreply.github.com"
            git add bancos.json
            git commit -m "chore: bancos do dia $(date -u +%Y-%m-%d)"
            git push
          fi
